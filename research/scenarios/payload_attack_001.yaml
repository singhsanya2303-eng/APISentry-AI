scenario_id: payload_attack_001
scenario_version: "1.0"
campaign_id: payload_attack_001
source_dataset: custom_crapi
target_origin: http://127.0.0.1:8888
crapi_commit: b5fc307f3e5f875809b095b771108ef342a33724
capture_tool: apisentry-controlled-runner
capture_tool_version: "6A"
controlled_accounts:
  - account_id: payload_test_user
    principal_id: payload_test_user
    role: user
resource_ownership: []
setup_actions:
  - action_id: payload_register
    campaign_id: payload_attack_001
    principal_id: payload_test_user
    session_id: payload_setup
    label: normal
    phase: setup
    expected_outcome: controlled account is created
    execution:
      method: POST
      path: /identity/api/auth/signup
      authentication: none
      body_fields: [email, name, number, password]
      credential_source: runtime_generated
      openapi_operation: signup
      response_semantics: registration result requires procedure verification
    mapping_policy:
      retained_kinds: [primary]
      api_path_prefixes: [/identity/api/]
  - action_id: payload_login
    campaign_id: payload_attack_001
    principal_id: payload_test_user
    session_id: payload_session
    label: normal
    phase: setup
    expected_outcome: login returns a runtime JWT
    execution:
      method: POST
      path: /identity/api/auth/login
      authentication: none
      body_fields: [email, password]
      credential_source: runtime_generated
      openapi_operation: login
      response_semantics: JWT is retained only in memory
    mapping_policy:
      retained_kinds: [primary]
      api_path_prefixes: [/identity/api/]
actions:
  - action_id: payload_safe_malformed_coupon
    campaign_id: payload_attack_001
    principal_id: payload_test_user
    session_id: payload_session
    label: attack
    attack_category: malformed_input
    expected_outcome: bounded malformed request is handled without service instability
    execution:
      method: POST
      path: /community/api/v2/coupon/validate-coupon
      authentication: bearer_jwt
      body_fields: [coupon_code]
      payload_source: bounded_synthetic_noncredential_value
      payload_constraints:
        max_bytes: 32
        contains_credentials: false
        contains_tokens: false
      openapi_operation: validate_coupon
      response_semantics: OpenAPI lists 200, 400, and 500; one response does not establish a vulnerability
      request_count: 1
      delay_ms: 0
    mapping_policy:
      retained_kinds: [primary]
      api_path_prefixes: [/community/api/]
cleanup_actions:
  - action_id: payload_cleanup
    campaign_id: payload_attack_001
    principal_id: payload_test_user
    session_id: payload_cleanup
    label: normal
    phase: cleanup
    expected_outcome: runtime-generated account is removed by controlled environment cleanup
    execution:
      method: NONE
      path: null
      authentication: operator
      operation: controlled_environment_cleanup
      response_semantics: no HTTP endpoint is claimed
    mapping_policy:
      retained_kinds: []
success_conditions:
  - payload is generated at runtime and remains bounded and noncredential
  - raw request and response bodies are never persisted
failure_conditions:
  - payload exceeds 32 bytes
  - payload contains credentials or tokens
