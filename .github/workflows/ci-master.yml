name: API Sentry CI (master)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Backend safe tests
        env:
          PYTHONPATH: backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q backend/tests
          --ignore=backend/tests/test_mitigation_policy_lifecycle_persistence.py
          --ignore=backend/tests/test_alembic_baseline.py

      - name: Frontend tests
        shell: bash
        run: |
          if compgen -G "frontend/tests/*.test.js" > /dev/null; then
            node --test frontend/tests/*.test.js
          else
            echo "Frontend tests are not present on this branch; skipping frontend test step."
          fi

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend production build
        run: npm --prefix frontend run build -- --outDir "$RUNNER_TEMP/apisentry-frontend-build"
